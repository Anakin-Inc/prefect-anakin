name: Publish to PyPI

# Release by pushing a tag: v0.1.0 publishes prefect-anakin 0.1.0.
# The tag must match the version in pyproject.toml.
#
# Uses PyPI trusted publishing (no API token). Before the first release, add
# a pending publisher on your PyPI account (Publishing -> Add a new pending
# publisher): project prefect-anakin, owner Anakin-Inc, repository
# prefect-anakin, workflow publish.yml, environment pypi.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "${REF_NAME#v}" != "$version" ]; then
            echo "Tag $REF_NAME doesn't match version $version" >&2
            exit 1
          fi
      - name: Test
        run: |
          uv venv
          uv pip install -e . --group test
          uv run --no-sync pytest
      - run: uv build --out-dir dist
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/prefect-anakin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/prefect-anakin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
