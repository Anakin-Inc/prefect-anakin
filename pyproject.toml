[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prefect-anakin"
version = "0.1.0"
description = "Prefect tasks and a credentials Block for Anakin — web scraping, AI search, and agentic research"
license = { text = "Apache-2.0" }
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "prefect>=3.0.0,<4.0.0",
    "anakin-sdk>=0.1.0,<0.2.0",
    # Used directly (not just transitively via anakin-sdk) by the tasks that
    # cover endpoints anakin-sdk v0.1.0 doesn't wrap yet (Website Monitoring,
    # AI Visibility, browser_task, Wire discovery/catalog/identities/login/
    # build) — see prefect_anakin/_http.py. Same floor anakin-sdk pins.
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://anakin.io"
Documentation = "https://anakin.io/docs"
Repository = "https://github.com/Anakin-Inc/anakin-prefect"
Issues = "https://github.com/Anakin-Inc/anakin-prefect/issues"

# Real Prefect discovery mechanism, confirmed against PrefectHQ/prefect's
# current source (src/prefect/_internal/plugins/collections.py): at import
# time, `prefect.plugins.load_prefect_collections()` calls
# `importlib.metadata.entry_points(group="prefect.collections")` and loads
# every entry point in that group. This is what makes an installed
# collection package's Blocks locally discoverable (e.g. by
# `prefect block register -m prefect_anakin`) — it is unrelated to, and
# does not by itself get a package listed on docs.prefect.io's public
# Integrations Catalog (see SUBMIT.md).
[project.entry-points."prefect.collections"]
prefect_anakin = "prefect_anakin"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
]
typing = [
    "mypy>=1.10.0,<2.0.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"

[tool.mypy]
disallow_untyped_defs = true
